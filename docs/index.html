<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#342a40"><meta name="apple-mobile-web-app-capable" content="yes"><title>Agenda da Lu</title><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/assets/app-icon-192.png"><link rel="stylesheet" href="/css/agenda.css?v=20260905-1"></head>
<body>
<section id="login" class="login"><form id="login-form"><img src="/assets/logo-lu-fashion-hair.png" alt=""><h1>Agenda da Lu</h1><label>Usuário<input id="usuario" value="lufashionhair" autocomplete="username"></label><label>Senha<input id="senha" type="password" autocomplete="current-password"></label><button>Entrar</button><p id="login-erro" role="alert"></p></form></section>
<main id="app" hidden><header><div class="marca"><img src="/assets/logo-lu-fashion-hair.png" alt=""><h1>Agenda da Lu</h1></div><button id="atualizar" class="discreto" aria-label="Atualizar agenda">Atualizar</button></header>
<section class="calendario-box"><div class="mes-barra"><button id="anterior" class="discreto" aria-label="Mês anterior">‹</button><h2 id="mes"></h2><button id="seguinte" class="discreto" aria-label="Próximo mês">›</button></div><div id="calendario" class="calendario"></div><button id="hoje" class="discreto">Voltar para hoje</button></section>
<section class="dia"><h2 id="dia-titulo"></h2><button id="novo">+ Marcar cliente</button><p id="erro" role="alert" hidden></p><div id="lista"></div></section><footer><button id="sair" class="discreto">Sair da conta</button></footer></main>
<dialog id="editor"><form id="marcacao"><h2 id="editor-titulo">Marcar cliente</h2><label>Nome da cliente<input id="nome" autocomplete="off" placeholder="Nome"></label><div class="dupla"><label>Dia<input id="data" type="date"></label><label>Horário<input id="hora" type="time"></label></div><label>Observação<textarea id="observacao" placeholder="Ex.: corte e escova" rows="2"></textarea></label><p id="form-erro" role="alert"></p><div class="dupla"><button id="voltar" type="button" class="discreto">Voltar</button><button id="salvar">Salvar</button></div></form></dialog>
<div id="aviso" role="status" hidden></div><script src="/js/api.js?v=20260905-1"></script><script src="/js/agenda.js?v=20260905-1"></script></body></html>
